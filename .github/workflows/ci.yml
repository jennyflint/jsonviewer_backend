name: backend-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=app --cov-fail-under=85   # testcontainers starts PostgreSQL (Docker is available on runners)
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
