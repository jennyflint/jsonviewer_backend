# Development override:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    volumes:
      - ./src:/app/src
    environment:
      UVICORN_WORKERS: "1"
      APP_ENV: development
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/src
      - --proxy-headers
      - --forwarded-allow-ips=*
  db:
    ports:
      - "127.0.0.1:5432:5432"
