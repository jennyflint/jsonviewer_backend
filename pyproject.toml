[project]
name = "jsonviewer-api"
version = "1.0.0"
description = "JSON Viewer API (Litestar + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]>=2.12,<3",
    "advanced-alchemy>=0.20,<1",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "msgspec>=0.18",
    "httpx>=0.27",
    "authlib>=1.3,<2",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "cryptography>=42",
    "anyio>=4",
    "redis>=5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "testcontainers[postgres]>=4",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S104", "S108", "E501", "S101", "B008", "RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["authlib.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["src/app"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
omit = ["src/app/main.py"]
